<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalMarket – Entregas</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/entregas.css">
<link rel="stylesheet" href="../css/dark.css">
<link rel="manifest" href="../manifest.json">
<script src="../js/shared.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/Cart.js" defer></script>
<script src="../js/Entregas.js" defer></script>
</head>
<body>

<!-- ══ NAV ══ -->
<nav>
  <a href="../html/index.html" class="nav-logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M3 3h18v2H3V3zm0 4h18v2H3V7zm0 4h18v2H3v-2zm0 4h12v2H3v-2z"/></svg>
    </div>
    LocalMarket
  </a>
  <ul class="nav-links" id="main-nav-links"></ul>
  <div class="nav-right">
    <button class="lm-theme-toggle" onclick="lmToggleTheme()" title="Modo oscuro"></button>
    <button class="cart-btn" onclick="window.location.href='carritoypago.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="cart-badge">0</span>
    </button>
  </div>
</nav>

<!-- ══ CONTENIDO ══ -->
<div class="del-wrap">

  <!-- Header dinámico -->
  <div class="del-header">
    <div>
      <h1>Seguimiento de Entrega</h1>
      <p class="subt" id="del-subtitle">
        Pedido <strong id="del-order-id">#—</strong> ·
        <span id="del-live-state">En tiempo real</span>
        <span class="live-pill" id="del-live-pill"><span class="live-dot"></span> Activo</span>
      </p>
    </div>
    <div class="header-actions">
      <button class="btn-ghost" id="btn-new-demo" title="Crear una entrega de demostración">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nueva entrega demo
      </button>
      <button class="btn-ghost" id="btn-clear" title="Eliminar todas las entregas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg>
        Limpiar
      </button>
    </div>
  </div>

  <!-- Tabs de pedidos (visibles si hay >1) -->
  <div class="orders-tabs" id="orders-tabs"></div>

  <!-- Contenido principal -->
  <div id="del-content"></div>

</div>

<!-- Toast -->
<div class="toast" id="toast">
  <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
  <span id="toast-msg">¡Listo!</span>
</div>

</body>
</html>
