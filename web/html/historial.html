<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalMarket – Historial de Pedidos</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/historial.css">
<link rel="stylesheet" href="../css/dark.css">
<script src="../js/shared.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/Cart.js" defer></script>
<script src="../js/historial.js" defer></script>
</head>
<body>

<nav>
  <a href="../html/index.html" class="nav-logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M3 3h18v2H3V3zm0 4h18v2H3V7zm0 4h18v2H3v-2zm0 4h12v2H3v-2z"/></svg>
    </div>
    LocalMarket
  </a>
  <ul class="nav-links" id="main-nav-links"></ul>
  <div class="nav-right">
    <button class="lm-theme-toggle" onclick="lmToggleTheme()" title="Modo oscuro"></button>
    <button class="cart-btn" onclick="window.location.href='carritoypago.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="cart-badge">0</span>
    </button>
  </div>
</nav>

<div class="historial-page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Historial de Pedidos</h1>
      <p class="page-subtitle">Todas tus compras en LocalMarket</p>
    </div>
    <button class="clear-btn" id="clear-btn">🗑 Limpiar historial</button>
  </div>

  <div class="hist-summary" id="hist-summary">
    <div class="summary-chip">
      <div class="summary-chip-num" id="stat-total-orders">0</div>
      <div class="summary-chip-label">Pedidos totales</div>
    </div>
    <div class="summary-chip">
      <div class="summary-chip-num" id="stat-total-spent">$0.00</div>
      <div class="summary-chip-label">Total gastado</div>
    </div>
    <div class="summary-chip">
      <div class="summary-chip-num" id="stat-fav-seller">—</div>
      <div class="summary-chip-label">Vendedor favorito</div>
    </div>
  </div>

  <div class="hist-filters">
    <button class="hist-filter active" data-filter="all">Todos</button>
    <button class="hist-filter" data-filter="entregado">Entregados</button>
    <button class="hist-filter" data-filter="en_camino">En camino</button>
    <button class="hist-filter" data-filter="preparando">Preparando</button>
  </div>

  <div id="orders-list"></div>
</div>

<div class="lm-toast" id="lm-toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="lm-toast-msg"></span>
</div>

</body>
</html>
