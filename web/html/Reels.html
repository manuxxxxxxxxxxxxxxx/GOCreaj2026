<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalMarket – Reels</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/Reels.css">
<link rel="stylesheet" href="../css/dark.css">
<link rel="manifest" href="../manifest.json">
<script src="../js/shared.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/Cart.js" defer></script>
<script src="../js/Reels.js" defer></script>
</head>
<body>

<!-- ══ NAV ══ -->
<nav>
  <a href="../html/index.html" class="nav-logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M3 3h18v2H3V3zm0 4h18v2H3V7zm0 4h18v2H3v-2zm0 4h12v2H3v-2z"/></svg>
    </div>
    LocalMarket
  </a>
  <ul class="nav-links" id="main-nav-links"></ul>
  <div class="nav-right">
    <button class="lm-theme-toggle" onclick="lmToggleTheme()" title="Modo oscuro"></button>
    <button class="cart-btn" onclick="window.location.href='../html/carritoypago.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="cart-badge">0</span>
    </button>
  </div>
</nav>

<!-- ══ REELS PAGE ══ -->
<div class="reels-page">

  <!-- Back -->
  <a class="back-link" href="../html/index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Volver
  </a>

  <!-- Center reels viewport -->
  <main class="reels-viewport" id="reels-viewport">
    <!-- reels insertados por JS -->
  </main>

  <!-- Right sidebar – Activity Tray -->
  <aside class="reels-sidebar">
    <div class="activity-tray">
      <div class="tray-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Mi Actividad
      </div>

      <div class="tray-tabs">
        <button class="tray-tab active" data-tab="saved">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          <span>Guardados</span>
        </button>
        <button class="tray-tab" data-tab="following">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Siguiendo</span>
        </button>
        <button class="tray-tab" data-tab="likes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span>Likes</span>
        </button>
        <button class="tray-tab" data-tab="comments">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>Comentado</span>
        </button>
      </div>

      <div class="tray-content" id="tray-content">
        <!-- renderizado por JS -->
      </div>
    </div>
  </aside>
</div>

<!-- ══ COMMENTS MODAL ══ -->
<div class="comments-modal" id="comments-modal">
  <div class="comments-backdrop" onclick="closeComments()"></div>
  <div class="comments-panel">
    <header class="comments-header">
      <h3>Comentarios <span id="comments-count">0</span></h3>
      <button class="close-btn" onclick="closeComments()" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </header>
    <div class="comments-list" id="comments-list"></div>
    <form class="comments-form" id="comments-form">
      <div class="avatar-mini">Tú</div>
      <input type="text" id="comment-input" placeholder="Escribe un comentario..." maxlength="200" autocomplete="off">
      <button type="submit" class="send-btn" aria-label="Enviar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </form>
  </div>
</div>

<!-- ══ SHARE MODAL ══ -->
<div class="share-modal" id="share-modal">
  <div class="share-backdrop" onclick="closeShare()"></div>
  <div class="share-panel">
    <header class="share-header">
      <h3>Compartir Reel</h3>
      <button class="close-btn" onclick="closeShare()" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </header>
    <div class="share-options">
      <button class="share-opt" data-net="whatsapp">
        <div class="share-ico" style="background:#25d366">
          <svg viewBox="0 0 24 24" fill="white"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9s-.5-.1-.7.1c-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1s-1.2-.5-2.3-1.4c-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5s-.7-1.7-1-2.3c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1.1 1-1.1 2.5s1.1 2.9 1.3 3.1c.1.2 2.2 3.5 5.4 4.7 2.7 1 3.2.9 3.8.8.6 0 2-.8 2.3-1.6.3-.8.3-1.5.2-1.6 0-.2-.3-.3-.5-.4zM12 2C6.5 2 2 6.5 2 12c0 1.7.4 3.4 1.3 4.9L2 22l5.3-1.4c1.4.8 3.1 1.2 4.7 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2z"/></svg>
        </div>
        <span>WhatsApp</span>
      </button>
      <button class="share-opt" data-net="facebook">
        <div class="share-ico" style="background:#1877f2">
          <svg viewBox="0 0 24 24" fill="white"><path d="M22 12c0-5.5-4.5-10-10-10S2 6.5 2 12c0 5 3.7 9.1 8.4 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.5 2.9h-2.4v7C18.3 21.1 22 17 22 12z"/></svg>
        </div>
        <span>Facebook</span>
      </button>
      <button class="share-opt" data-net="twitter">
        <div class="share-ico" style="background:#000">
          <svg viewBox="0 0 24 24" fill="white"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        </div>
        <span>X / Twitter</span>
      </button>
      <button class="share-opt" data-net="copy">
        <div class="share-ico" style="background:#6366f1">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        </div>
        <span>Copiar enlace</span>
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
  <span id="toast-msg">¡Listo!</span>
</div>

</body>
</html>
